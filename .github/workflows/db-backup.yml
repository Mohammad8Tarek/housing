name: DB Backup

on:
  schedule:
    # 03:00 Africa/Cairo (UTC+2, Egypt has no DST) = 01:00 UTC, nightly
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  backup:
    name: Nightly dump + restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore-test
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RESTORE_URL: postgresql://postgres:restore-test@localhost:5432/restore_test
    steps:
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: Dump production database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner --no-privileges \
            --file=staff-housing.dump
          ls -lh staff-housing.dump
      - name: Verify dump restores into scratch Postgres
        run: |
          pg_restore --dbname "$RESTORE_URL" --no-owner --no-privileges --exit-on-error staff-housing.dump
          psql "$RESTORE_URL" -Atc "SELECT count(*) || ' tables restored' FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema')"
      - name: Upload dump artifact (14-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: staff-housing-dump-${{ github.run_number }}
          path: staff-housing.dump
          retention-days: 14
