<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e05c2a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="192" height="192" rx="40" fill="url(#grad1)"/>

  <!-- House icon group -->
  <g transform="translate(40, 35)">
    <!-- Roof -->
    <polygon points="56,0 0,48 8,48 8,104 104,104 104,48 112,48" fill="white" opacity="0.98"/>

    <!-- House body -->
    <rect x="8" y="48" width="96" height="56" fill="white" opacity="0.95"/>

    <!-- Door -->
    <rect x="44" y="72" width="24" height="32" fill="#0d0f14" opacity="0.2"/>

    <!-- Door knob -->
    <circle cx="66" cy="88" r="3" fill="white" opacity="0.8"/>

    <!-- Window left -->
    <rect x="20" y="60" width="14" height="14" fill="white" opacity="0.4" rx="2"/>
    <!-- Window pane left -->
    <line x1="27" y1="60" x2="27" y2="74" stroke="white" stroke-width="1" opacity="0.2"/>
    <line x1="20" y1="67" x2="34" y2="67" stroke="white" stroke-width="1" opacity="0.2"/>

    <!-- Window right -->
    <rect x="76" y="60" width="14" height="14" fill="white" opacity="0.4" rx="2"/>
    <!-- Window pane right -->
    <line x1="83" y1="60" x2="83" y2="74" stroke="white" stroke-width="1" opacity="0.2"/>
    <line x1="76" y1="67" x2="90" y2="67" stroke="white" stroke-width="1" opacity="0.2"/>

    <!-- Chimney -->
    <rect x="88" y="20" width="8" height="16" fill="white" opacity="0.6"/>
  </g>

  <!-- Accent accent -->
  <circle cx="12" cy="12" r="3" fill="white" opacity="0.3"/>
</svg>