<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e05c2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>

  <!-- House icon group -->
  <g transform="translate(106, 90)">
    <!-- Roof -->
    <polygon points="150,0 0,130 20,130 20,280 280,280 280,130 300,130" fill="white" opacity="0.98"/>

    <!-- House body -->
    <rect x="20" y="130" width="260" height="150" fill="white" opacity="0.95"/>

    <!-- Door -->
    <rect x="120" y="190" width="60" height="90" fill="#0d0f14" opacity="0.2"/>

    <!-- Door knob -->
    <circle cx="175" cy="240" r="8" fill="white" opacity="0.8"/>

    <!-- Window left -->
    <rect x="55" y="160" width="38" height="38" fill="white" opacity="0.4" rx="4"/>
    <!-- Window cross left -->
    <line x1="74" y1="160" x2="74" y2="198" stroke="white" stroke-width="2" opacity="0.2"/>
    <line x1="55" y1="179" x2="93" y2="179" stroke="white" stroke-width="2" opacity="0.2"/>

    <!-- Window right -->
    <rect x="207" y="160" width="38" height="38" fill="white" opacity="0.4" rx="4"/>
    <!-- Window cross right -->
    <line x1="226" y1="160" x2="226" y2="198" stroke="white" stroke-width="2" opacity="0.2"/>
    <line x1="207" y1="179" x2="245" y2="179" stroke="white" stroke-width="2" opacity="0.2"/>

    <!-- Chimney -->
    <rect x="240" y="50" width="20" height="50" fill="white" opacity="0.6"/>
  </g>
</svg>