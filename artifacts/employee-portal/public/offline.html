<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f0a500" />
  <title>بلا اتصال - Sunrise Housing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0d0f14 0%, #1a1d28 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      opacity: 0.8;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: #999;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .box h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f0a500;
    }

    .box p {
      font-size: 13px;
      color: #ccc;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-direction: column;
      margin-top: 30px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f0a500, #e05c2a);
      color: white;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }

    .network-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }
      .subtitle {
        font-size: 14px;
      }
    }

    .status-badge {
      display: inline-block;
      background: rgba(255, 59, 48, 0.1);
      color: #ff3b30;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="network-icon pulse">
      📡
    </div>

    <div class="status-badge">بلا اتصال انترنت</div>

    <h1>لا توجد اتصالية</h1>

    <p class="subtitle">
      يبدو أنك غير متصل بالإنترنت. تحقق من اتصالك وحاول مرة أخرى.
    </p>

    <div class="box">
      <h3>💡 ماذا يمكنك أن تفعل؟</h3>
      <p>
        تطبيقك محفوظ في هاتفك. يمكنك عرض بيانات تم حفظها مسبقاً عند العودة للاتصال.
      </p>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="tryReload()">
        🔄 حاول مرة أخرى
      </button>
      <button class="btn-secondary" onclick="goHome()">
        🏠 العودة للرئيسية
      </button>
    </div>

    <div class="footer">
      <p>سيتم إعادة المحاولة تلقائياً عند استعادة الاتصال</p>
    </div>
  </div>

  <script>
    function tryReload() {
      location.reload();
    }

    function goHome() {
      window.location.href = '/';
    }

    // Auto retry when connection is restored
    window.addEventListener('online', () => {
      console.log('Connection restored, reloading...');
      setTimeout(() => location.reload(), 1000);
    });

    // Check connection status
    if (navigator.onLine) {
      console.log('Online but API is down, showing offline page');
    }
  </script>
</body>
</html>
