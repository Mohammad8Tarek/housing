<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="40" fill="#0d0f14"/>
  <rect width="192" height="192" rx="40" fill="url(#g1)"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0a500"/>
      <stop offset="1" stop-color="#e05c2a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- House shape -->
  <g transform="translate(96,96)">
    <!-- Roof -->
    <polygon points="0,-52 52,4 -52,4" fill="url(#g2)"/>
    <!-- Body -->
    <rect x="-36" y="4" width="72" height="48" rx="4" fill="url(#g2)"/>
    <!-- Door -->
    <rect x="-12" y="20" width="24" height="32" rx="4" fill="#0d0f14" opacity="0.4"/>
    <!-- Windows -->
    <rect x="-30" y="12" width="16" height="14" rx="3" fill="#0d0f14" opacity="0.25"/>
    <rect x="14" y="12" width="16" height="14" rx="3" fill="#0d0f14" opacity="0.25"/>
  </g>
</svg>
