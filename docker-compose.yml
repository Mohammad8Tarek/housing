services:
  db:
    image: postgres:16-alpine
    container_name: sunrise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-staff-housing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup_clean.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-staff-housing}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sunrise-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sunrise-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-staff-housing}
      REDIS_URL: redis://redis:6379
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sunrise-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-9000}:9000"
    depends_on:
      - backend

  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: sunrise-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-10000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
