# ============================================================
# Sunrise Housing — Production Nginx with SSL
# ============================================================
# Instructions:
# 1. Set DOMAIN_NAME in .env (e.g., "portal.sunrise-housing.com")
# 2. Run: docker compose -f docker-compose.ssl.yml up -d
# 3. Get SSL certs: docker exec sunrise-nginx certbot --nginx -d $DOMAIN_NAME
# ============================================================

upstream backend {
    server backend:4000;
}

# ─── Employee Portal (main user-facing app) ────────────────
server {
    listen 80;
    server_name portal.sunrise-housing.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.sunrise-housing.com;

    ssl_certificate     /etc/letsencrypt/live/portal.sunrise-housing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.sunrise-housing.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html/portal;
    index index.html;

    # PWA required headers
    add_header Service-Worker-Allowed "/";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # PWA manifest & service worker - no cache
    location ~* (manifest\.webmanifest|registerSW\.js|worker.*\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ─── Admin Housing App ─────────────────────────────────────
