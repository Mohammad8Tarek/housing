packages:
  - artifacts/*
  - lib/*
  - scripts

allowBuilds:
  "@scarf/scarf": set this to true or false
  "@sentry/node-cpu-profiler": set this to true or false
  core-js: true
  esbuild: true
  msgpackr-extract: set this to true or false

autoInstallPeers: false

catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.21
  "@types/node": ^25.3.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.1
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: 4.21.0
  vite: ^7.3.0
  zod: ^3.25.76

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild

overrides:
  esbuild: 0.27.3
  # Security patches for runtime (api-server / Express 5) transitive deps.
  # Pinned within the existing major so no breaking API changes.
  qs: ^6.17.1
  proxy-addr: ^2.0.8
  compression: ^1.8.2
  body-parser: ^2.4.0
  nodemailer: ^10.6.1
